# docker-compose.yml
version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: ./backend.Dockerfile
    container_name: symfony-backend
    ports:
      - "8080:80"
    volumes:
      - ./alcazan-back-prod:/var/www/html
      - /var/www/html/var/cache
    environment:
      DATABASE_URL: mysql://root:password@mysql:3306/chusei
    depends_on:
      - mysql

  frontend:
    build:
      context: .
      dockerfile: ./frontend.Dockerfile
    container_name: react-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./alcazan-front-prod:/usr/src/app
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://127.0.0.1:8080/api/

  # Régénération horaire des PA/PM (voir src/Command/RegenPointsCommand.php)
  scheduler:
    image: alcazan-docker-backend
    container_name: alcazan-scheduler
    volumes:
      - ./alcazan-back-prod:/var/www/html
      - /var/www/html/var/cache
    environment:
      DATABASE_URL: mysql://root:password@mysql:3306/chusei
    command: bash -c "sleep 30; while true; do php bin/console app:regen-points || true; sleep 3600; done"
    depends_on:
      - mysql
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: chusei
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony

volumes:
  db_data:
